<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RailTrack - Live Train Tracking</title>
  
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Floating UI Overlay (Top) -->
  <div class="floating-ui top-bar">
    <div>
      <h1 class="brand-logo pointer-events-auto">RailTrack<span class="brand-dot">.</span></h1>
      <div class="live-badge pointer-events-auto"><span class="live-dot"></span> 0 live trains</div>
    </div>
    <div class="city-dropdown pointer-events-auto">Finnish Railways (VR) <span>▼</span></div>
  </div>

  <!-- Right Side Tools -->
  <div class="floating-ui side-tools pointer-events-auto">
    <button class="tool-btn">⚙️</button>
    <button class="tool-btn toggle-3d-btn">2D</button>
    <button class="tool-btn location-btn">⌖</button>
  </div>

  <!-- Floating Bottom Nav Button -->
  <div class="floating-ui bottom-nav pointer-events-auto" id="main-bottom-nav">
    <button class="nav-item active" id="open-route-planner">🗺 Map & Routing</button>
  </div>

  <!-- Hidden Bottom Route Planner Panel -->
  <div class="bottom-route-panel" id="route-panel">
    <button class="close-btn" id="close-route-panel" style="position: absolute; right: 20px; top: 20px;">×</button>
    <h3 style="margin-top: 0; margin-bottom: 20px;">Find Routes</h3>
    
    <div class="route-input-group">
      <label>From</label>
      <input type="text" class="route-input" id="route-from" placeholder="e.g. Turku">
    </div>
    
    <div style="text-align: center; margin-bottom: 12px; color: #888;">↑↓</div>

    <div class="route-input-group">
      <label>To</label>
      <input type="text" class="route-input" id="route-to" placeholder="e.g. Helsinki">
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 20px;">
      <button class="btn-action" style="background: rgba(255,255,255,0.1); color: white;">Leave now</button>
      <button class="btn-action" style="background: rgba(255,255,255,0.1); color: white;">Depart at...</button>
    </div>

    <button class="btn-action" id="search-routes-btn" style="background: #00BFA5; color: #1a1a1a;">Search Routes</button>
    
    <!-- This is where the searched routes will dynamically appear -->
    <div id="route-results-container" class="route-results-scrollable"></div>
  </div>

  <!-- Sliding Station Panel (Right) -->
  <div class="station-panel" id="station-panel">
    <button class="close-btn" id="close-panel">×</button>
    <h3>Live Station Schedule</h3>
    
    <button class="btn-action" id="find-near-me">📍 Find Nearest Station</button>
    
    <div style="text-align: center; font-size: 12px; opacity: 0.7;">— OR —</div>
    
    <select class="search-box" id="station-select">
      <option value="" disabled selected>Select a station manually...</option>
    </select>

    <h4 id="current-station-title" style="margin-top: 10px; color: #00BFA5;"></h4>
    <div class="schedule-list" id="schedule-results"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="index.js"></script>
  <!-- Sliding Settings Panel (Left Side) -->
  <div class="settings-panel" id="settings-panel">
    <button class="close-btn" id="close-settings-panel">×</button>
    <h3 style="margin-top: 0; margin-bottom: 20px;">Settings</h3>
    
    <div class="settings-group">
      <h4>Filter Trains</h4>
      <label class="toggle-row">
        <span>Commuter Trains</span>
        <input type="checkbox" id="filter-commuter" checked>
      </label>
      <label class="toggle-row">
        <span>Long-Distance (IC/Pendolino)</span>
        <input type="checkbox" id="filter-longdist" checked>
      </label>
    </div>

    <div class="settings-group">
      <h4>Battery Saver</h4>
      <p style="font-size: 12px; color: #888; margin-top: 0;">Reduces how often train locations update.</p>
      <select class="search-box" id="refresh-rate">
        <option value="5000">High Performance (5s)</option>
        <option value="15000">Balanced (15s)</option>
        <option value="30000">Battery Saver (30s)</option>
      </select>
    </div>
  </div>
</body>
</html>

  <div class="container">
    
    <!-- Live Map Section -->
    <div class="row mb-5">
      <div class="col-12">
        <h4 class="mb-3">Real-Time Train Locations</h4>
        <div id="map"></div>
      </div>
    </div>

    <!-- Train Information Cards -->
    <div class="row mb-5">
      <div class="col-12">
        <h4 class="mb-3">Available Fleet</h4>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm">
          <img src="https://www.financialexpress.com/wp-content/uploads/2023/06/vande-bharat-express.jpg" class="card-img-top" alt="Express Train">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Express Train</h5>
            <p class="card-text text-muted">High-speed intercity connections.</p>
            <button class="btn btn-outline-primary mt-auto w-100">View Schedule</button>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm">
          <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Western-Railway-Medha-EMU.jpg" class="card-img-top" alt="Local Train">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Local Train</h5>
            <p class="card-text text-muted">Frequent stops for commuter transit.</p>
            <button class="btn btn-outline-primary mt-auto w-100">View Schedule</button>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/JRE-TEC-E5_omiya.JPG/1200px-JRE-TEC-E5_omiya.JPG" class="card-img-top" alt="Bullet Train">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Bullet Train</h5>
            <p class="card-text text-muted">Ultra high-speed premium travel.</p>
            <button class="btn btn-outline-primary mt-auto w-100">View Schedule</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Ticket Booking Section -->
    <div class="row mb-5 justify-content-center">
      <div class="col-md-8">
        <div class="booking-section">
          <h4 class="mb-4">Book Your Ticket</h4>
          <form id="ticket-booking-form">
            <div class="mb-3">
              <label for="select-train" class="form-label">Select a Train Type</label>
              <select class="form-select" id="select-train" required>
                <option value="" selected disabled>Choose...</option>
                <option value="express">Express train</option>
                <option value="local">Local train</option>
                <option value="bullet">Bullet train</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label for="passenger-name" class="form-label">Passenger Name</label>
              <input type="text" class="form-control" id="passenger-name" placeholder="Enter full name" required>
            </div>
            
            <div class="mb-3">
              <label for="num-tickets" class="form-label">Number of Tickets</label>
              <input type="number" class="form-control" id="num-tickets" value="1" min="1" max="100" required>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mt-4">
              <span class="text-success fw-bold">Available Tickets: <span id="available-tickets">100</span></span>
              <button type="submit" class="btn btn-primary px-4">Confirm Booking</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-auto">

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Initialize the Map (Centered on Turku)
    const map = L.map('map').setView([60.4518, 22.2666], 12);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Custom Train Icon
    const trainIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -16]
    });

    // 2. Setup Mock Live Tracking Data around the city
    const mockTrains = [
      { id: 'EXP-101', lat: 60.4550, lng: 22.2600, speed: 85, type: 'Express' },
      { id: 'LOC-204', lat: 60.4400, lng: 22.2800, speed: 45, type: 'Local' },
      { id: 'BUL-909', lat: 60.4600, lng: 22.2300, speed: 120, type: 'Bullet' }
    ];

    const markers = {};

    // Initial marker placement
    mockTrains.forEach(train => {
      markers[train.id] = L.marker([train.lat, train.lng], { icon: trainIcon })
        .bindPopup(`<b>${train.id} (${train.type})</b><br>Speed: ${train.speed} km/h`)
        .addTo(map);
    });

    // Simulate movement every 2 seconds
    setInterval(() => {
      mockTrains.forEach(train => {
        // Randomly shift latitude and longitude slightly to simulate movement
        train.lat += (Math.random() - 0.5) * 0.002;
        train.lng += (Math.random() - 0.5) * 0.002;
        
        // Update marker position
        markers[train.id].setLatLng([train.lat, train.lng]);
      });
    }, 2000);

    // 3. Simple Booking Form Logic
    const bookingForm = document.getElementById('ticket-booking-form');
    let availableTickets = 100;
    const ticketDisplay = document.getElementById('available-tickets');

    bookingForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const numRequested = parseInt(document.getElementById('num-tickets').value);
      
      if (numRequested <= availableTickets) {
        availableTickets -= numRequested;
        ticketDisplay.textContent = availableTickets;
        alert(`Successfully booked ${numRequested} ticket(s)!`);
        bookingForm.reset();
      } else {
        alert("Not enough tickets available!");
      }
    });
  </script>
